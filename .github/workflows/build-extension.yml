name: Build Chrome Extension

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build Chrome extension
        run: npm run build

      - name: Package unpacked Chrome extension
        shell: bash
        run: |
          set -euo pipefail
          EXT_DIR=".output/chrome-mv3"
          test -f "$EXT_DIR/manifest.json"
          cd "$EXT_DIR"
          zip -qr "$GITHUB_WORKSPACE/vibes-content-generator-chrome.zip" .

      - name: Verify installable ZIP
        run: |
          test -s vibes-content-generator-chrome.zip
          unzip -l vibes-content-generator-chrome.zip | grep -q 'manifest.json'

      - name: Upload installable extension ZIP
        uses: actions/upload-artifact@v4
        with:
          name: vibes-content-generator-chrome
          path: vibes-content-generator-chrome.zip
          if-no-files-found: error
          retention-days: 30
