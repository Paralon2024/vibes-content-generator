name: Build Chrome Extension

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build and package Chrome extension
        run: npm run zip

      - name: Verify packaged extension
        shell: bash
        run: |
          set -euo pipefail
          find .output -maxdepth 1 -type f -name '*.zip' -print -quit | grep -q .

      - name: Upload installable extension ZIP
        uses: actions/upload-artifact@v4
        with:
          name: vibes-content-generator-chrome
          path: .output/*.zip
          if-no-files-found: error
          retention-days: 30
